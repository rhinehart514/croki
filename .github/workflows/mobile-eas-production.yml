name: Mobile EAS Production

# Production builds and OTA updates run from CI (Linux) — never from a laptop.
# Under the fingerprint runtime-version policy the fingerprint must be computed
# in the same OS/pnpm as the EAS build; a macOS `eas build` computes a different
# fingerprint (platform-specific deps + pnpm version) and errors. On this Linux
# runner, with corepack pinning pnpm 10.24 in eas.json, local == build.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run plan, build (+ auto-submit to TestFlight), or update (OTA)"
        required: true
        type: choice
        default: build
        options:
          - dry-run
          - build
          - update
      platform:
        description: "Target platform"
        required: true
        type: choice
        default: ios
        options:
          - ios
          - android
          - all
      message:
        description: "OTA update message (mode=update only)"
        required: false
        type: string

jobs:
  release_guard:
    name: Verify Croki mobile ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
    env:
      CROKI_MOBILE_DEPLOY_ENABLED: ${{ vars.CROKI_MOBILE_DEPLOY_ENABLED }}
      CROKI_RELEASE_REPOSITORY: ${{ vars.CROKI_RELEASE_REPOSITORY }}
      CROKI_RELEASE_BRANCH: ${{ vars.CROKI_RELEASE_BRANCH }}
      CROKI_EAS_PROJECT_ID: ${{ vars.CROKI_EAS_PROJECT_ID }}
      CROKI_EXPO_TOKEN: ${{ secrets.CROKI_EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Croki release destination plan
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.mode }}" == "dry-run" ]]; then
            npm run --silent release:croki:plan
          else
            node scripts/croki-release-plan.ts --production
          fi

      - name: Fail closed until Croki EAS is configured
        if: inputs.mode != 'dry-run'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$CROKI_MOBILE_DEPLOY_ENABLED" != "true" ]]; then
            echo "Croki mobile production deploys are disabled." >&2
            exit 1
          fi
          if [[ -z "$CROKI_RELEASE_REPOSITORY" || "$GITHUB_REPOSITORY" != "$CROKI_RELEASE_REPOSITORY" ]]; then
            echo "This repository is not configured as the Croki release repository." >&2
            exit 1
          fi
          if [[ -z "$CROKI_RELEASE_BRANCH" || "$GITHUB_REF_NAME" != "$CROKI_RELEASE_BRANCH" ]]; then
            echo "Production mobile deploys must run from the configured Croki release branch." >&2
            exit 1
          fi
          if [[ -z "$CROKI_EAS_PROJECT_ID" || "$CROKI_EAS_PROJECT_ID" == "d763fcb8-d37c-41ea-a773-b54a0ab4a454" ]]; then
            echo "CROKI_EAS_PROJECT_ID must identify a Croki-owned EAS project, not the inherited T3 project." >&2
            exit 1
          fi
          if [[ -z "$CROKI_EXPO_TOKEN" ]]; then
            echo "Missing CROKI_EXPO_TOKEN." >&2
            exit 1
          fi
          if grep -Eq 'owner: "pingdotgg"|com\.t3tools\.t3code|slug: "t3-code"' apps/mobile/app.config.ts; then
            echo "Inherited T3 EAS owner, slug, or application identifiers must be replaced before production deploys." >&2
            exit 1
          fi

  production:
    name: EAS Production ${{ inputs.mode }}
    needs: release_guard
    if: needs.release_guard.result == 'success' && inputs.mode != 'dry-run'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - id: expo-token
        name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.CROKI_EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not available; skipping EAS production job."
          fi

      - name: Checkout
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        if: steps.expo-token.outputs.present == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Expose pnpm
        if: steps.expo-token.outputs.present == 'true'
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        if: steps.expo-token.outputs.present == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.CROKI_EXPO_TOKEN }}
          # npm, not pnpm: this only installs eas-cli into the action's own
          # tool dir, and pnpm 11 hard-fails that install on dtrace-provider's
          # ignored build script (no allowBuilds config outside the repo).
          packager: npm

      - name: Verify configured EAS project
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EXPECTED_EAS_PROJECT_ID: ${{ vars.CROKI_EAS_PROJECT_ID }}
        run: |
          config_path="$RUNNER_TEMP/croki-expo-config.json"
          pnpm exec expo config --json > "$config_path"
          actual_project_id="$(
            node -e 'const fs = require("node:fs"); const config = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(config.extra?.eas?.projectId ?? "");' "$config_path"
          )"
          if [[ "$actual_project_id" != "$EXPECTED_EAS_PROJECT_ID" ]]; then
            echo "EAS project mismatch: expected $EXPECTED_EAS_PROJECT_ID, got ${actual_project_id:-<missing>}." >&2
            exit 1
          fi

      - name: Pull production environment variables
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.CROKI_EXPO_TOKEN }}
        run: eas env:pull production --non-interactive

      - name: Build and submit
        if: steps.expo-token.outputs.present == 'true' && inputs.mode == 'build'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.CROKI_EXPO_TOKEN }}
        run: eas build --platform ${{ inputs.platform }} --profile production --auto-submit --non-interactive --no-wait

      - name: Publish OTA update
        if: steps.expo-token.outputs.present == 'true' && inputs.mode == 'update'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.CROKI_EXPO_TOKEN }}
        run: |
          eas update \
            --channel production \
            --environment production \
            --platform ${{ inputs.platform }} \
            --message "${{ inputs.message || format('Production OTA ({0})', github.sha) }}" \
            --non-interactive
