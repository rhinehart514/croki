name: Build Croki for Windows

on:
  push:
    branches:
      - croki/main
  workflow_dispatch:
    inputs:
      version:
        description: Installer version
        required: false
        type: string

permissions:
  contents: read

jobs:
  wsl_node_pty:
    name: Prepare WSL support
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Build WSL node-pty
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node

      - name: Upload WSL support
        uses: actions/upload-artifact@v7
        with:
          name: croki-wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Build Windows x64 installer
    needs: wsl_node_pty
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - id: version
        name: Resolve installer version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-}"
          if [[ -z "$version" ]]; then
            version="$(node -p "require('./apps/desktop/package.json').version")"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid installer version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Download WSL support
        uses: actions/download-artifact@v8
        with:
          name: croki-wsl-node-pty-x64
          path: wsl-prebuild

      - name: Install Spectre-mitigated MSVC libraries
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $process = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $process -or $process.ExitCode -ne 0) {
            $exitCode = if ($null -ne $process) { $process.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $exitCode"
            exit $exitCode
          }

      - name: Build Croki installer
        shell: bash
        run: |
          # Manual artifacts are not an update channel. Omit inherited repository metadata.
          GITHUB_REPOSITORY="" vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ steps.version.outputs.value }}" \
            --wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node"

      - name: Upload Croki installer
        uses: actions/upload-artifact@v7
        with:
          name: croki-windows-x64-${{ steps.version.outputs.value }}
          path: |
            release/Croki-*.exe
            release/Croki-*.blockmap
            release/*.yml
          if-no-files-found: error
          retention-days: 14
