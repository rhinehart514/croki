name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Complete readiness gate
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify workflow dependency paths
        run: node scripts/check-workflow-lockfiles.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Install site dependencies
        run: npm --prefix site ci

      - name: Run complete readiness gate
        run: npm run test:acceptance 2>&1 | tee acceptance.log

      - name: Preserve the readiness receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: croki-readiness-${{ github.run_id }}
          path: acceptance.log
          if-no-files-found: warn
