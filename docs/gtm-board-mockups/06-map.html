<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Map — your go-to-market, in plain words</title>
<style>
  :root{
    --paper:#fafafa; --surface:#ffffff; --ink:#111113; --ink-2:#3f3f46; --muted:#6b6b75; --faint:#a1a1aa;
    --line:#e6e6e9; --line-2:#f0f0f2; --working:#16a34a; --working-soft:#f0fdf4;
    --approve:#b9740a; --approve-soft:#fbf3e9; --danger:#dc2626; --danger-soft:#fef2f2; --blank:#c8c8cf;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
    --r:13px; --shadow:0 1px 2px rgba(0,0,0,.05); --shadow-pop:0 16px 40px -16px rgba(20,20,25,.30);
    --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.5,.5,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased}

  /* top strip — the only orientation. plain words, no jargon. */
  .top{position:absolute;top:0;left:0;right:0;height:54px;z-index:30;display:flex;align-items:center;gap:14px;
    padding:0 22px;background:rgba(250,250,250,.8);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top .mk{width:24px;height:24px;border-radius:7px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px}
  .top .title{font-weight:600;font-size:14px;letter-spacing:-.01em}
  .top .where{font-size:13px;color:var(--muted)}
  .top .where b{color:var(--ink);font-weight:600}
  .top .heads{margin-left:auto;font-size:12.5px;color:var(--danger);background:var(--danger-soft);
    border:1px solid #f3d0d0;border-radius:999px;padding:6px 13px;display:flex;align-items:center;gap:7px;cursor:pointer}
  .top .heads .d{width:6px;height:6px;border-radius:50%;background:var(--danger)}

  .stage{position:absolute;inset:0;overflow:hidden;
    background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:24px 24px}
  .world{position:absolute;top:0;left:0;transform-origin:0 0;transition:transform .5s var(--ease)}
  .world.drag{transition:none}
  svg.wires{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
  .wire{fill:none;stroke:var(--line);stroke-width:1.5}
  .wire.loop{stroke:var(--faint);stroke-dasharray:5 5;opacity:.6}

  /* NODES — one grammar. plain language. */
  .node{position:absolute;width:248px;background:var(--surface);border:1px solid var(--line);
    border-left:3px solid var(--blank);border-radius:var(--r);padding:13px 15px 14px;box-shadow:var(--shadow);
    cursor:pointer;transition:box-shadow .18s var(--ease),transform .18s var(--ease),border-color .18s}
  .node:hover{box-shadow:var(--shadow-pop);transform:translateY(-2px)}
  .node.proven{border-left-color:var(--working)}
  .node.needs{border-left-color:var(--danger)}
  .node.running{border-left-color:var(--ink)}
  .node .q{font-size:11px;color:var(--faint);font-weight:500;letter-spacing:.01em}
  .node .a{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3;margin-top:4px;color:var(--ink)}
  .node .s{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4;display:flex;align-items:center;gap:6px}
  .node .s .chip{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px}
  .chip.proven{color:var(--working);background:var(--working-soft)}
  .chip.needs{color:var(--danger);background:var(--danger-soft)}
  .chip.guess{color:var(--muted);background:#f4f4f5}
  .chip.running{color:var(--ink-2);background:#f4f4f5}
  .node .more{margin-top:10px;font-size:11.5px;color:var(--faint);display:flex;align-items:center;gap:5px;opacity:0;transition:.18s}
  .node:hover .more{opacity:1}

  /* densified child nodes */
  .child{position:absolute;width:188px;background:var(--surface);border:1px solid var(--line-2);
    border-left:2.5px solid var(--blank);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);
    opacity:0;transform:scale(.9) translateY(6px);transition:opacity .4s var(--ease),transform .42s var(--spring);pointer-events:none}
  .child.show{opacity:1;transform:none;pointer-events:auto}
  .child.proven{border-left-color:var(--working)} .child.needs{border-left-color:var(--danger)}
  .child .ck{font-size:10px;color:var(--faint);font-family:var(--mono)}
  .child .cn{font-size:13px;font-weight:600;margin-top:2px;letter-spacing:-.01em}
  .child .cs{font-size:11.5px;color:var(--muted);margin-top:3px}

  /* summoned nodes glow in */
  .node.summoned,.child.summoned{animation:pop .5s var(--spring)}
  @keyframes pop{0%{opacity:0;transform:scale(.8)}100%{opacity:1;transform:none}}

  /* SUMMON — the do-anything verb */
  .summon-btn{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:25;
    background:var(--ink);color:#fff;border:none;border-radius:999px;padding:13px 22px 13px 18px;font-size:14px;
    font-weight:600;cursor:pointer;box-shadow:var(--shadow-pop);display:flex;align-items:center;gap:9px;
    transition:transform .16s var(--ease)}
  .summon-btn:hover{transform:translateX(-50%) translateY(-2px)}
  .summon-btn .plus{font-size:17px;line-height:1}
  .summon-menu{position:absolute;left:50%;bottom:80px;transform:translateX(-50%) translateY(8px);z-index:26;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-pop);
    padding:7px;width:300px;opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease)}
  .summon-menu.open{opacity:1;pointer-events:auto;transform:translateX(-50%)}
  .summon-menu .mh{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:8px 11px 6px}
  .summon-menu button{display:flex;align-items:center;gap:11px;width:100%;border:none;background:none;cursor:pointer;
    padding:10px 11px;border-radius:9px;text-align:left;transition:background .12s}
  .summon-menu button:hover{background:#f4f4f5}
  .summon-menu .ic{width:28px;height:28px;flex:0 0 28px;border-radius:8px;background:#f4f4f5;display:grid;place-items:center;font-size:14px}
  .summon-menu .lbl{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
  .summon-menu .sub{font-size:11.5px;color:var(--muted);margin-top:1px}

  /* controls */
  .ctrls{position:absolute;right:22px;bottom:26px;z-index:20;display:flex;flex-direction:column;gap:1px;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
  .ctrls button{width:32px;height:30px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:15px;border-bottom:1px solid var(--line-2)}
  .ctrls button:last-child{border-bottom:none}
  .ctrls button:hover{background:#f4f4f5;color:var(--ink)}

  .hint{position:absolute;left:22px;bottom:30px;z-index:20;font-size:12px;color:var(--faint);max-width:230px;line-height:1.5}
  .hint b{color:var(--muted)}
  .toast{position:absolute;left:50%;top:70px;transform:translateX(-50%) translateY(-8px);z-index:40;
    background:var(--ink);color:#fff;font-size:13px;padding:9px 15px;border-radius:10px;box-shadow:var(--shadow-pop);
    opacity:0;pointer-events:none;transition:.25s var(--ease)}
  .toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<div class="top">
  <div class="mk">▦</div>
  <div class="title">RodentRadar</div>
  <div class="where" id="where">Your go-to-market — the whole thing, one map</div>
  <div class="heads" id="heads"><span class="d"></span> 2 weak spots — start here</div>
</div>

<div class="stage" id="stage">
  <div class="world" id="world">
    <svg class="wires" id="wires" width="4000" height="2400"></svg>
  </div>

  <button class="summon-btn" id="summonBtn"><span class="plus">+</span> Summon</button>
  <div class="summon-menu" id="summonMenu">
    <div class="mh">Bring something onto the map</div>
    <button data-s="people"><span class="ic">👥</span><span><div class="lbl">More people to sell to</div><div class="sub">3 other kinds of buyer to try</div></span></button>
    <button data-s="lines"><span class="ic">✍️</span><span><div class="lbl">Sharper ways to say it</div><div class="sub">5 one-liners to test</div></span></button>
    <button data-s="reach"><span class="ic">📣</span><span><div class="lbl">A new way to reach them</div><div class="sub">draft an outreach campaign</div></span></button>
    <button data-s="rivals"><span class="ic">🗺️</span><span><div class="lbl">A competitor map</div><div class="sub">where you sit vs the others</div></span></button>
  </div>

  <div class="hint" id="hint"><b>Drag</b> to roam · <b>click a node</b> to go deeper · <b>Summon</b> to bring anything onto the map</div>
  <div class="ctrls"><button id="zin">+</button><button id="zout">−</button><button id="zfit">⊡</button></div>
  <div class="toast" id="toast"></div>
</div>

<script>
// ── the GTM as ONE map of plain-language nodes ──────────────────
const NODES = {
  who:    {x:120,  y:150, cls:'proven',  q:'Who you sell to',      a:'Pest-control operators with food-facility accounts', s:'Proven', chip:'proven',  chipTxt:'proven · won a test',
           kids:[{cls:'proven',k:'kept',n:'Pest-control operators',s:'won, 3 replies'},{cls:'needs',k:'killed',n:'Restaurants',s:'tried, 0 replies'}]},
  why:    {x:120,  y:430, cls:'running', q:'Why they\'d buy now',  a:'They just failed a health inspection', s:'3 live reasons', chip:'running', chipTxt:'3 happening now',
           kids:[{cls:'running',k:'hot',n:'Failed inspection',s:'9 found this week'},{cls:'running',k:'warm',n:'New big account',s:'2 found'}]},
  say:    {x:470,  y:120, cls:'running', q:'How you say it',        a:'"See which sensor stopped the infestation"', s:'Testing 2 versions', chip:'running', chipTxt:'A/B running',
           kids:[{cls:'running',k:'A',n:'"proves the win"',s:'14% reply — leading'},{cls:'running',k:'B',n:'"24/7 monitoring"',s:'6% reply'}]},
  pay:    {x:470,  y:420, cls:'needs',   q:'What they pay',         a:'Not decided yet', s:'Needs you', chip:'needs', chipTxt:'you haven\'t set this',
           kids:[{cls:'needs',k:'?',n:'Free trial?',s:'or a paid pilot?'},{cls:'needs',k:'?',n:'Price?',s:'undecided'}]},
  reach:  {x:830,  y:230, cls:'running', q:'How you reach them',    a:'2 outreach campaigns running', s:'3 drafts waiting for you', chip:'running', chipTxt:'3 to approve',
           kids:[{cls:'running',k:'live',n:'Email to owners',s:'8 found · 6 drafted'},{cls:'needs',k:'gate',n:'3 waiting for your OK',s:'review to send'}]},
  people: {x:1180, y:170, cls:'running', q:'People you\'re talking to', a:'12 people — 3 are close to a yes', s:'', chip:'running', chipTxt:'3 near a yes',
           kids:[{cls:'running',k:'hot',n:'Dana Okafor',s:'replied, wants a call'},{cls:'running',k:'',n:'+ 11 more',s:'across both campaigns'}]},
  works:  {x:1180, y:470, cls:'needs',   q:'What\'s working',       a:'You can\'t prove it yet — flying blind', s:'Needs you', chip:'needs', chipTxt:'no proof yet',
           kids:[{cls:'needs',k:'gap',n:'No tracking on the link',s:'can\'t tell what drove replies'}]},
  learn:  {x:760,  y:680, cls:'proven',  q:'What you\'ve learned',  a:'Kept "pest-control", killed "restaurants"', s:'1 decision', chip:'proven', chipTxt:'feeds back to the top',
           kids:[{cls:'proven',k:'kept',n:'Pest-control is the buyer',s:'becomes what you know'}]},
};
const EDGES = [['who','say'],['who','why'],['why','reach'],['say','reach'],['pay','reach'],['reach','people'],['people','works'],['works','learn']];

const world=document.getElementById('world'), wires=document.getElementById('wires'), stage=document.getElementById('stage');
const toast=document.getElementById('toast');

function anchor(id,side){const p=NODES[id];return side==='r'?{x:p.x+248,y:p.y+44}:{x:p.x,y:p.y+44};}
function drawWires(){
  let h='';
  EDGES.forEach(([a,b])=>{const A=anchor(a,'r'),B=anchor(b,'l');const mx=(A.x+B.x)/2;
    h+=`<path class="wire" d="M ${A.x} ${A.y} C ${mx} ${A.y}, ${mx} ${B.y}, ${B.x} ${B.y}"/>`;});
  // the loop: learn → who
  const L=anchor('learn','l'), W=anchor('who','l');
  h+=`<path class="wire loop" d="M ${L.x} ${L.y+20} C ${L.x-260} ${980}, ${W.x-120} ${760}, ${W.x} ${W.y+30}"/>`;
  wires.innerHTML=h;
}
function buildNodes(){
  [...world.querySelectorAll('.node,.child')].forEach(n=>n.remove());
  Object.entries(NODES).forEach(([id,p])=>{
    const el=document.createElement('button');el.className=`node ${p.cls}`;el.id='n-'+id;
    el.style.left=p.x+'px';el.style.top=p.y+'px';
    el.innerHTML=`<div class="q">${p.q}</div><div class="a">${p.a}</div>
      <div class="s">${p.chip?`<span class="chip ${p.chip}">${p.chipTxt}</span>`:p.s}</div>
      <div class="more">click to go deeper ↓</div>`;
    el.onclick=(e)=>{e.stopPropagation();toggleKids(id);};
    world.appendChild(el);
  });
  drawWires();
}
let opened=null;
function toggleKids(id){
  // remove existing kids
  [...world.querySelectorAll('.child')].forEach(c=>c.remove());
  if(opened===id){opened=null;return;}
  opened=id;
  const p=NODES[id];
  (p.kids||[]).forEach((k,i)=>{
    const c=document.createElement('div');c.className=`child ${k.cls}`;
    c.style.left=(p.x+90+i*30)+'px';c.style.top=(p.y+92+i*86)+'px';
    c.innerHTML=`<div class="ck">${k.k}</div><div class="cn">${k.n}</div><div class="cs">${k.s}</div>`;
    world.appendChild(c);
    requestAnimationFrame(()=>requestAnimationFrame(()=>c.classList.add('show')));
  });
  flash(`Went deeper into "${p.q}" — more detail, same map.`);
}

// camera
let cam={x:30,y:50,scale:.82};
function apply(){world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.scale})`;}
document.getElementById('zin').onclick=()=>{cam.scale=Math.min(1.4,cam.scale+.12);apply();};
document.getElementById('zout').onclick=()=>{cam.scale=Math.max(.4,cam.scale-.12);apply();};
document.getElementById('zfit').onclick=()=>{cam={x:30,y:50,scale:.62};apply();};
// pan
let drag=null;
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.node,.child,.summon-btn,.summon-menu,.ctrls,.heads'))return;
  drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};world.classList.add('drag');});
window.addEventListener('pointermove',e=>{if(!drag)return;cam.x=drag.cx+(e.clientX-drag.x);cam.y=drag.cy+(e.clientY-drag.y);apply();});
window.addEventListener('pointerup',()=>{if(drag){drag=null;world.classList.remove('drag');}});
stage.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();cam.scale=Math.max(.4,Math.min(1.5,cam.scale-e.deltaY*.002));apply();}},{passive:false});

// SUMMON
const sBtn=document.getElementById('summonBtn'), sMenu=document.getElementById('summonMenu');
sBtn.onclick=(e)=>{e.stopPropagation();sMenu.classList.toggle('open');};
document.addEventListener('click',()=>sMenu.classList.remove('open'));
sMenu.addEventListener('click',e=>e.stopPropagation());
const SUMMONS={
  people:{anchor:'who',label:'people to sell to',items:[
    {cls:'running',q:'Could sell to',a:'Warehouses with pest risk',s:'new — untested'},
    {cls:'running',q:'Could sell to',a:'Food-processing plants',s:'new — untested'},
    {cls:'running',q:'Could sell to',a:'Property managers',s:'new — untested'}]},
  lines:{anchor:'say',label:'one-liners',items:[
    {cls:'running',q:'Way to say it',a:'"Catch the rats before the inspector does"',s:'new — test it'},
    {cls:'running',q:'Way to say it',a:'"Proof your traps are working"',s:'new — test it'}]},
  reach:{anchor:'reach',label:'a campaign',items:[
    {cls:'running',q:'New way to reach them',a:'LinkedIn to ops managers',s:'draft staged for your OK'}]},
  rivals:{anchor:'say',label:'competitor map',items:[
    {cls:'proven',q:'You',a:'RodentRadar — proves the win',s:'where you sit'},
    {cls:'needs',q:'Them',a:'Manual logs / generic sensors',s:'the white space'}]},
};
let summonCount=0;
sMenu.querySelectorAll('button').forEach(b=>{
  b.onclick=(e)=>{e.stopPropagation();sMenu.classList.remove('open');
    const def=SUMMONS[b.dataset.s];const base=NODES[def.anchor];
    def.items.forEach((it,i)=>{
      const el=document.createElement('button');el.className=`node ${it.cls} summoned`;
      const nx=base.x+300+(summonCount%2)*40, ny=base.y-40+i*116+summonCount*8;
      el.style.left=nx+'px';el.style.top=ny+'px';
      el.innerHTML=`<div class="q">${it.q}</div><div class="a">${it.a}</div>
        <div class="s"><span class="chip ${it.cls==='proven'?'proven':it.cls==='needs'?'needs':'running'}">${it.s}</span></div>`;
      world.appendChild(el);
    });
    summonCount++;
    flash(`Summoned ${def.label} onto the map — same language, ready to use.`);
    // nudge camera toward the new stuff
    cam.x-=120;apply();
  };
});

let tT;
function flash(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>toast.classList.remove('show'),2600);}

// "start here" — orientation, not a separate mode
document.getElementById('heads').onclick=()=>{
  cam={x:-360,y:-40,scale:.92};apply();
  flash('Your two weak spots: you haven\'t set a price, and you can\'t prove what\'s working. Fix these to start closing.');
  setTimeout(()=>{document.getElementById('n-pay')?.classList.add('summoned');document.getElementById('n-works')?.classList.add('summoned');},200);
};

buildNodes();apply();
</script>
</body>
</html>
