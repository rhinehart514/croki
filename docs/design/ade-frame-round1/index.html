<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ADE Frame — Round 1</title>
<style>
  * { margin:0; box-sizing:border-box; }
  body { font: 14px/1.5 -apple-system, "Helvetica Neue", sans-serif; background:#e6e2da; color:#26241f; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:baseline; gap:16px; padding:10px 20px; border-bottom:1px solid #d4cfc4; }
  header h1 { font-size:14px; font-weight:600; }
  header .hint { color:#7a756a; font-size:12px; }
  nav { display:flex; gap:6px; margin-left:auto; }
  nav button { font:12px ui-monospace, monospace; padding:6px 14px; border:1px solid #c9c3b6; border-radius:999px; background:transparent; cursor:pointer; color:#26241f; }
  nav button.on { background:#2e4636; color:#f2efe8; border-color:#2e4636; }
  iframe { flex:1; width:100%; border:0; background:#eae6df; }
</style>
</head>
<body>
<header>
  <h1>Drover ADE — Round 1</h1>
  <span class="hint">Three divergent takes on the same decided frame · real venture data · 2026-07-15</span>
  <nav>
    <button data-src="a-study.html" class="on">A · Study</button>
    <button data-src="b-instrument.html">B · Instrument</button>
    <button data-src="c-terrarium.html">C · Terrarium</button>
  </nav>
</header>
<iframe src="a-study.html" id="stage"></iframe>
<script>
  document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    document.getElementById("stage").src = b.dataset.src;
  }));
</script>
</body>
</html>
