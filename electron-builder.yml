appId: com.gtmide.desktop
productName: Croki
copyright: Croki
publish: null

# Brain and renderer files remain inspectable in the local alpha package. Native dependencies are already
# rebuilt by prepare:pty; electron-builder must not replace them with a different ABI afterward.
asar: false
npmRebuild: false

directories:
  output: release
  buildResources: build

afterPack: build/after-pack.cjs

files:
  - electron/**/*
  - brain/**/*
  - ui/dist/**/*
  - package.json
  - "!**/*.map"
  - "!brain/test/**"
  - "!**/*.test.mjs"
  - "!**/.env.local"
  - "!**/.DS_Store"

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
  identity: null

dmg:
  title: Croki
